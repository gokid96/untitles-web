# Android 앱 빌드
# - push: android/ 나 앱 설정이 바뀌면 디버그 빌드로 확인만
# - 수동 실행(Actions 탭 > Android > Run workflow): 서명된 AAB를 만들어 아티팩트로 올림
#   → 실행 결과 페이지 아래 Artifacts에서 내려받아 Play Console에 업로드
#
# 필요한 저장소 Secrets (Settings > Secrets and variables > Actions)
#   ANDROID_KEYSTORE_BASE64   업로드 키(.jks) 파일을 base64로 바꾼 값
#   ANDROID_KEYSTORE_PASSWORD 키스토어 비밀번호
#   ANDROID_KEY_ALIAS         키 별칭 (예: upload)
#   ANDROID_KEY_PASSWORD      키 비밀번호 (보통 키스토어 비밀번호와 같음)
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: 웹 빌드 + Android 동기화
        run: |
          npm ci
          npx vite build
          npx cap sync android

      - name: 디버그 빌드 확인
        if: github.event_name != 'workflow_dispatch'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 업로드 키 준비
        if: github.event_name == 'workflow_dispatch'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 Secret이 없습니다. 워크플로 파일 상단 안내를 참고하세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: 서명된 AAB 빌드 (versionCode = 실행 번호)
        if: github.event_name == 'workflow_dispatch'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon

      - name: AAB 올리기
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: untitles-android-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: 업로드 키 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
